<rect x="930" y="170" width="220" height="105" rx="18" fill="#173d4a" stroke="#4e9c91" stroke-width="2"/><text x="1040" y="211" fill="#f4fbff" font-size="21" font-weight="700">Pest Results</text><text x="1040" y="242" fill="#b7d7d8" font-size="16">Class · confidence</text>
