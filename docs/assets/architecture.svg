<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">PestGuard system architecture</title><desc id="desc">User image upload flows through preprocessing and HybridPestNet classification, then pest information and AI advisory, with location-based supplier discovery.</desc>
