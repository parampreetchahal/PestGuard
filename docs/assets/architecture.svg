<rect width="1200" height="700" rx="30" fill="url(#bg)"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4fbff">PestGuard · System Architecture</text><text x="60" y="104" font-family="Arial,sans-serif" font-size="17" fill="#b7d7d8">From pest image to actionable agricultural guidance</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
